[project]
name = "mp3-x"
version = "0.1.0"
description = "Clean, dark desktop-style UI for downloading YouTube/SoundCloud media (MP3, MP4 and more), powered by yt-dlp."
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"yt-dlp[default]>=2026.10.21",
	"mediafile",
	"pillow",
]

[tool.uv]
package = true

[project.scripts]
mp3-x = "mp3_x.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/mp3_x"]
